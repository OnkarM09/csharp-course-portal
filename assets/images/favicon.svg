<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Dark Squircle -->
  <rect width="128" height="128" rx="30" fill="#0b0f19" />
  
  <!-- Subtle Gradient Border -->
  <rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="url(#brandGrad)" stroke-width="2.5" opacity="0.8" />
  
  <!-- Subtle Glowing Core -->
  <circle cx="64" cy="64" r="46" fill="url(#brandGrad)" opacity="0.12" filter="url(#softGlow)" />

  <!-- Outer Hexagonal Tech Shield -->
  <path d="M64 16 L104 39 L104 89 L64 112 L24 89 L24 39 Z" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="2" 
        stroke-linejoin="round" 
        opacity="0.45" />

  <!-- Main C# Monogram -->
  <g filter="url(#softGlow)">
    <!-- Stylized 'C' -->
    <path d="M52 44 C40 44 32 52 32 64 C32 76 40 84 52 84 C59 84 64 80 67 75" 
          fill="none" 
          stroke="url(#innerGrad)" 
          stroke-width="9" 
          stroke-linecap="round" />

    <!-- Stylized '#' Hash Tag -->
    <!-- Vertical Bars -->
    <path d="M76 48 L71 80" fill="none" stroke="url(#brandGrad)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M92 48 L87 80" fill="none" stroke="url(#brandGrad)" stroke-width="5.5" stroke-linecap="round" />
    <!-- Horizontal Crossbars -->
    <path d="M66 58 L98 58" fill="none" stroke="url(#brandGrad)" stroke-width="5.5" stroke-linecap="round" />
    <path d="M64 70 L96 70" fill="none" stroke="url(#brandGrad)" stroke-width="5.5" stroke-linecap="round" />
  </g>
</svg>
